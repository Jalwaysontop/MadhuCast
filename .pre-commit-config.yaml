repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.9.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit, mock backend)
        entry: python -m pytest -q -m "not smoke"
        language: system
        pass_filenames: false
        stages: [pre-push]
