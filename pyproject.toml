[project]
name = "madhutwin"
version = "0.1.0"
description = "Open, ablation-tested, EHR-conditioned T2D digital twin with a clinician-facing what-if lab (research PoC)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract' -p no:cacheprovider"
markers = [
    "contract: run the contract assertions against MADHUTWIN_BACKEND=real (integration gate)",
    "smoke: Streamlit AppTest page smoke tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"dashboard/pages/*.py" = ["E402", "I001"]
"dashboard/app.py" = ["E402", "I001"]

[tool.black]
line-length = 120
target-version = ["py311"]
